<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Widyara Property</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><a class="brand" href="./">WIDYARA<span>PROPERTY ADMIN</span></a><a href="./">Lihat website</a></header><main class="admin-wrap"><h1>Dashboard Admin</h1><p class="muted">Kelola listing properti Widyara Property.</p><div id="status" class="notice">Hubungkan Supabase melalui config.js dan ikuti README sebelum login.</div><section class="admin-panel" id="loginPanel"><h2>Login Admin</h2><div class="admin-form"><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button class="btn full" id="login">Login</button></div></section><section class="admin-panel hidden" id="editor"><h2 id="formTitle">Tambah listing</h2><form class="admin-form" id="propertyForm"><input id="title" required placeholder="Nama properti"><select id="category"><option>Tanah</option><option>Rumah</option><option>Villa</option><option>Komersial</option></select><input id="location" required placeholder="Lokasi"><input id="price" type="number" required placeholder="Harga total (angka)"><input id="land_area" type="number" placeholder="Luas tanah m²"><input id="bedrooms" type="number" placeholder="Kamar tidur"><input id="bathrooms" type="number" placeholder="Kamar mandi"><input id="images" class="full" placeholder="URL foto, pisahkan dengan koma"><textarea id="description" placeholder="Deskripsi lengkap"></textarea><select id="status"><option value="published">Tayang</option><option value="draft">Draft</option></select><button class="btn full" type="submit">Simpan listing</button><button class="btn full" type="button" id="reset">Kosongkan form</button></form><h2>Daftar listing</h2><div id="list"></div><button class="btn danger" id="logout">Logout</button></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
